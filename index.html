<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accedi — Gestionale Palestra</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f507b;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 48px rgba(0,0,0,.24);
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .login-logo img {
      width: 62px;
      height: 62px;
      object-fit: contain;
    }

    .login-logo-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1a2942;
      text-align: center;
      line-height: 1.3;
    }

    .login-logo-sub {
      font-size: .72rem;
      font-weight: 500;
      color: #6b7a99;
      text-align: center;
      margin-top: -6px;
    }

    .login-divider {
      border: none;
      border-top: 1px solid #e4eaf1;
      margin-bottom: 24px;
    }

    .login-error {
      background: #fef0f4;
      color: #e6165c;
      border: 1px solid #f9c4d3;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .8rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-error.visible { display: flex; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: .72rem;
      font-weight: 700;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .form-control {
      padding: 10px 13px;
      border: 1.5px solid #e4eaf1;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem;
      color: #1a2942;
      background: #ffffff;
      transition: border-color .18s, box-shadow .18s;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: #0f507b;
      box-shadow: 0 0 0 3px rgba(15,80,123,.12);
    }

    .form-control::placeholder { color: #6b7a99; opacity: .6; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #e6165c;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login:hover:not(:disabled) { background: #c01149; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-note {
      text-align: center;
      margin-top: 20px;
      font-size: .72rem;
      color: #6b7a99;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="pittogramma_Strategica.png" alt="Logo" />
      <div class="login-logo-title">Gestionale Palestra</div>
      <div class="login-logo-sub">Area riservata</div>
    </div>

    <hr class="login-divider" />

    <div class="login-error" id="loginError">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="loginErrorText">Email o password non corretti.</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-control"
             placeholder="inserisci la tua email" autocomplete="email" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control"
             placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="btnLogin">
      <span id="btnText">Accedi</span>
      <span id="btnSpinner" class="spinner hidden"></span>
    </button>

    <p class="login-note">Non hai un account? Contatta l'amministratore.</p>

  </div>
</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCIYt0tgl0MQbG3KAkpqTg_ZZMykT0w8lw",
    authDomain:        "gestionale-palestra-44dba.firebaseapp.com",
    projectId:         "gestionale-palestra-44dba",
    storageBucket:     "gestionale-palestra-44dba.firebasestorage.app",
    messagingSenderId: "127344006319",
    appId:             "1:127344006319:web:a478ba76a586e8c1b7705a"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // Se già loggato → redirect automatico
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists()) return;
      window.location.href = snap.data().role === 'admin'
        ? 'dashboard.html'
        : 'calendario-corsista.html';
    } catch (e) {}
  });

  const btnLogin   = document.getElementById('btnLogin');
  const btnText    = document.getElementById('btnText');
  const btnSpinner = document.getElementById('btnSpinner');
  const errorBox   = document.getElementById('loginError');
  const errorText  = document.getElementById('loginErrorText');

  function setLoading(on) {
    btnLogin.disabled = on;
    btnText.classList.toggle('hidden', on);
    btnSpinner.classList.toggle('hidden', !on);
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('visible');
  }

  function hideError() {
    errorBox.classList.remove('visible');
  }

  async function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    hideError();

    if (!email)    { showError('Inserisci la tua email.'); return; }
    if (!password) { showError('Inserisci la password.'); return; }

    setLoading(true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));

      if (!snap.exists()) {
        showError('Account non configurato. Contatta l\'amministratore.');
        setLoading(false);
        return;
      }

      window.location.href = snap.data().role === 'admin'
        ? 'dashboard.html'
        : 'calendario-corsista.html';

    } catch (err) {
      const c = err.code || '';
      if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(c)) {
        showError('Email o password non corretti. Riprova.');
      } else if (c === 'auth/invalid-email') {
        showError('Formato email non valido.');
      } else if (c === 'auth/too-many-requests') {
        showError('Troppi tentativi. Attendi qualche minuto e riprova.');
      } else if (c === 'auth/network-request-failed') {
        showError('Errore di connessione. Controlla internet e riprova.');
      } else {
        showError('Errore durante il login. Riprova.');
      }
      setLoading(false);
    }
  }

  btnLogin.addEventListener('click', handleLogin);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  document.getElementById('email').addEventListener('input', hideError);
  document.getElementById('password').addEventListener('input', hideError);
</script>

</body>
</html>
